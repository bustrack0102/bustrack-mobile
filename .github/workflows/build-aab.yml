# Compila el Android App Bundle (AAB) firmado en modo Release y lo publica como artefacto.
# Requiere los secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_PASSWORD y ANDROID_KEY_ALIAS. Ver docs/android-release-signing.md.
name: Build AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/upload-keystore.jks
      KEY_PROPERTIES_PATH: ${{ github.workspace }}/android/key.properties
      AAB_PATH: build/app/outputs/bundle/release/app-release.aab

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Ejecutar flutter doctor
        run: flutter doctor -v

      - name: Instalar dependencias
        run: flutter pub get

      - name: Ejecutar flutter analyze
        run: flutter analyze

      - name: Ejecutar pruebas
        run: flutter test

      - name: Recuperar credenciales de firma desde GitHub Secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          missing=""
          for var in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS; do
            if [ -z "${!var:-}" ]; then
              missing="$missing $var"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Faltan GitHub Secrets:$missing"
            exit 1
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"

          if ! keytool -list -keystore "$ANDROID_KEYSTORE_PATH" \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::La upload keystore no se pudo abrir o el alias no existe."
            exit 1
          fi

          {
            echo "storeFile=$ANDROID_KEYSTORE_PATH"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > "$KEY_PROPERTIES_PATH"
          chmod 600 "$KEY_PROPERTIES_PATH"

          echo "Credenciales de firma preparadas (valores no mostrados en el log)."

      - name: Compilar AAB (release)
        run: flutter build appbundle --release

      - name: Verificar AAB y su firma
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "$AAB_PATH" ]; then
            echo "::error::No se generó el AAB en $AAB_PATH"
            exit 1
          fi

          if ! jarsigner -verify "$AAB_PATH" > /dev/null 2>&1; then
            echo "::error::jarsigner no pudo verificar una firma válida en el AAB."
            exit 1
          fi

          aab_fingerprint="$(keytool -printcert -jarfile "$AAB_PATH" \
            | grep -m1 -E 'SHA-?256:' | awk '{print $2}' | tr -d ':')"
          upload_fingerprint="$(keytool -list -v -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" \
            | grep -m1 -E 'SHA-?256:' | awk '{print $2}' | tr -d ':')"

          if [ -z "$aab_fingerprint" ] || [ -z "$upload_fingerprint" ]; then
            echo "::error::No se pudo obtener la huella SHA-256 para comparar firmas."
            exit 1
          fi

          if [ "$aab_fingerprint" != "$upload_fingerprint" ]; then
            echo "::error::El AAB no está firmado con la upload key configurada."
            exit 1
          fi

          echo "AAB verificado: firma válida y certificado coincide con la upload key."

      - name: Publicar AAB como artefacto
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab-${{ github.run_number }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 90
          if-no-files-found: error

      - name: Limpiar archivos temporales de firma
        if: always()
        shell: bash
        run: |
          rm -f "$ANDROID_KEYSTORE_PATH" "$KEY_PROPERTIES_PATH"
          echo "Archivos temporales de firma eliminados."
