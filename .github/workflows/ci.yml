name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detectar stack
        id: stack
        shell: bash
        run: |
          if [ -f pubspec.yaml ]; then
            echo "stack=flutter" >> "$GITHUB_OUTPUT"
          else
            echo "stack=kotlin" >> "$GITHUB_OUTPUT"
          fi
      - name: Configurar Java
        if: steps.stack.outputs.stack == 'kotlin'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configurar Flutter
        if: steps.stack.outputs.stack == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Validacion Flutter
        if: steps.stack.outputs.stack == 'flutter'
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed .
          flutter analyze
          flutter test --coverage
      - name: Validacion Kotlin
        if: steps.stack.outputs.stack == 'kotlin'
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon detekt ktlintCheck test koverVerify
      - name: Validacion SDD
        run: pwsh -File scripts/check_sdd.ps1
      - name: Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: .semgrep/rules/semgrep.yaml
