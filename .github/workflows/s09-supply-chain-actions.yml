name: Sec 09. Supply Chain e Integridad

on:
  push:
    branches: [feat/security-and-engineering-repertoire, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pwsh -File scripts/run_mobile_security_repertoire.ps1
      - run: |
          for f in .github/workflows/*.yml; do
            grep -q "permissions:" "" || { echo "Missing permissions in "; exit 1; }
          done
